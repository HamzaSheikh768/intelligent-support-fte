name: CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
      
      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -n customer-success-fte
          kubectl apply -f k8s/secrets.yaml -n customer-success-fte
          kubectl set image deployment/fte-api fte-api=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
          kubectl set image deployment/fte-worker fte-worker=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fte-api -n customer-success-fte --timeout=300s
          kubectl rollout status deployment/fte-worker -n customer-success-fte --timeout=300s
      
      - name: Run smoke tests
        run: |
          curl -f https://staging-support-api.${{ vars.DOMAIN }}/health
          curl -f https://staging-support-api.${{ vars.DOMAIN }}/docs

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
      
      - name: Deploy to production
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -n customer-success-fte
          kubectl apply -f k8s/secrets.yaml -n customer-success-fte
          kubectl set image deployment/fte-api fte-api=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
          kubectl set image deployment/fte-worker fte-worker=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fte-api -n customer-success-fte --timeout=300s
          kubectl rollout status deployment/fte-worker -n customer-success-fte --timeout=300s
      
      - name: Run health check
        run: |
          curl -f https://support-api.${{ vars.DOMAIN }}/health
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful: ${{ github.sha }}"
