name: CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate prerequisites
        run: |
          echo "🔍 Validating deployment prerequisites..."
          
          # Check for required secrets (warning only, not blocking for testing)
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::warning::KUBE_CONFIG secret is not set. Deployment will fail without valid kubeconfig."
            echo "📝 To fix: Go to Settings → Secrets and variables → Actions → New repository secret"
            echo "   Name: KUBE_CONFIG"
            echo "   Value: Your base64-encoded kubeconfig file"
          else
            echo "✅ KUBE_CONFIG secret is configured"
          fi
          
          # Check for required variables
          if [ -z "${{ vars.REGISTRY }}" ]; then
            echo "::error::REGISTRY variable is not set. This is required for deployment."
            echo "📝 To fix: Go to Settings → Secrets and variables → Actions → Variables → New repository variable"
            echo "   Name: REGISTRY"
            echo "   Value: ghcr.io/yourusername or docker.io/yourusername"
            exit 1
          else
            echo "✅ REGISTRY variable is set to: ${{ vars.REGISTRY }}"
          fi
          
          if [ -z "${{ vars.DOMAIN }}" ]; then
            echo "::warning::DOMAIN variable is not set. Health checks will fail."
            echo "📝 To fix: Go to Settings → Secrets and variables → Actions → Variables → New repository variable"
            echo "   Name: DOMAIN"
            echo "   Value: yourdomain.com"
          else
            echo "✅ DOMAIN variable is set to: ${{ vars.DOMAIN }}"
          fi
          
          # Check for k8s files
          echo ""
          echo "📁 Checking Kubernetes manifest files..."
          if [ ! -f "k8s/namespace.yaml" ]; then
            echo "::error::k8s/namespace.yaml not found"
            exit 1
          fi
          echo "✅ k8s/namespace.yaml exists"
          
          if [ ! -f "k8s/configmap.yaml" ]; then
            echo "::error::k8s/configmap.yaml not found"
            exit 1
          fi
          echo "✅ k8s/configmap.yaml exists"
          
          if [ ! -f "k8s/secrets.yaml" ]; then
            echo "::error::k8s/secrets.yaml not found"
            exit 1
          fi
          echo "✅ k8s/secrets.yaml exists"
          
          echo ""
          echo "✅ All prerequisites validated"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          echo "🔧 Configuring kubectl..."
          
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::Cannot configure kubectl: KUBE_CONFIG secret is not set"
            echo "Skipping deployment (testing mode)"
            exit 0
          fi
          
          # Decode and save kubeconfig
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
          # Verify kubeconfig is valid
          if ! kubectl cluster-info &> /dev/null; then
            echo "::error::Failed to connect to Kubernetes cluster"
            echo "Check if KUBE_CONFIG secret contains valid kubeconfig"
            exit 1
          fi
          
          echo "✅ Successfully connected to Kubernetes cluster"
          kubectl cluster-info

      - name: Deploy to staging
        if: steps.configure-kubectl.outcome == 'success'
        run: |
          echo "🚀 Starting deployment to staging environment..."
          
          export KUBECONFIG=kubeconfig
          
          # Apply namespace
          echo "📦 Applying namespace..."
          kubectl apply -f k8s/namespace.yaml
          
          # Apply configmap
          echo "📦 Applying configmap..."
          kubectl apply -f k8s/configmap.yaml -n customer-success-fte
          
          # Apply secrets
          echo "📦 Applying secrets..."
          kubectl apply -f k8s/secrets.yaml -n customer-success-fte
          
          # Update API image
          echo "📦 Updating fte-api image..."
          kubectl set image deployment/fte-api fte-api=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
          
          # Update worker image (if deployment exists)
          if kubectl get deployment fte-worker -n customer-success-fte &> /dev/null; then
            echo "📦 Updating fte-worker image..."
            kubectl set image deployment/fte-worker fte-worker=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
          else
            echo "⚠️ fte-worker deployment not found, skipping..."
          fi
          
          echo "✅ Deployment manifests applied"

      - name: Wait for rollout
        if: steps.configure-kubectl.outcome == 'success'
        run: |
          echo "⏳ Waiting for deployment rollout..."
          
          export KUBECONFIG=kubeconfig
          
          # Wait for API deployment
          echo "Waiting for fte-api deployment..."
          kubectl rollout status deployment/fte-api -n customer-success-fte --timeout=300s
          
          # Wait for worker deployment (if exists)
          if kubectl get deployment fte-worker -n customer-success-fte &> /dev/null; then
            echo "Waiting for fte-worker deployment..."
            kubectl rollout status deployment/fte-worker -n customer-success-fte --timeout=300s
          fi
          
          echo "✅ Rollout completed successfully"

      - name: Run smoke tests
        if: steps.configure-kubectl.outcome == 'success' && vars.DOMAIN != ''
        run: |
          echo "🧪 Running smoke tests..."
          
          # Test health endpoint
          echo "Testing /health endpoint..."
          if curl -f --max-time 30 https://staging-support-api.${{ vars.DOMAIN }}/health; then
            echo "✅ Health check passed"
          else
            echo "::warning::Health check failed (endpoint may not be ready yet)"
          fi
          
          # Test docs endpoint
          echo "Testing /docs endpoint..."
          if curl -f --max-time 30 https://staging-support-api.${{ vars.DOMAIN }}/docs; then
            echo "✅ API docs accessible"
          else
            echo "::warning::API docs not accessible (may be normal if disabled)"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          
          if [ "${{ steps.validate-prerequisites.outcome }}" == "success" ]; then
            echo "| Prerequisites | ✅ Passed |"
          else
            echo "| Prerequisites | ❌ Failed |"
          fi
          
          if [ "${{ steps.configure-kubectl.outcome }}" == "success" ]; then
            echo "| Kubectl Config | ✅ Passed |"
          else
            echo "| Kubectl Config | ⚠️ Skipped (testing mode) |"
          fi
          
          if [ "${{ steps.deploy-to-staging.outcome }}" == "success" ]; then
            echo "| Deployment | ✅ Passed |"
          elif [ "${{ steps.configure-kubectl.outcome }}" == "skipped" ]; then
            echo "| Deployment | ⚠️ Skipped |"
          else
            echo "| Deployment | ❌ Failed |"
          fi
          
          if [ "${{ steps.run-smoke-tests.outcome }}" == "success" ]; then
            echo "| Smoke Tests | ✅ Passed |"
          elif [ "${{ steps.configure-kubectl.outcome }}" == "skipped" ]; then
            echo "| Smoke Tests | ⚠️ Skipped |"
          else
            echo "| Smoke Tests | ⚠️ Warnings or Skipped |"
          fi
          
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Environment: staging"
          echo "Registry: ${{ vars.REGISTRY }}"

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: always() && needs.deploy-staging.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check staging deployment status
        run: |
          if [ "${{ needs.deploy-staging.result }}" != "success" ]; then
            echo "::error::Staging deployment did not succeed. Cannot deploy to production."
            exit 1
          fi
          echo "✅ Staging deployment successful, proceeding to production"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          echo "🔧 Configuring kubectl for production..."
          
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::Cannot configure kubectl: KUBE_CONFIG secret is not set"
            exit 1
          fi
          
          # Decode and save kubeconfig
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
          # Verify kubeconfig is valid
          if ! kubectl cluster-info &> /dev/null; then
            echo "::error::Failed to connect to Kubernetes cluster"
            exit 1
          fi
          
          echo "✅ Successfully connected to production Kubernetes cluster"

      - name: Deploy to production
        run: |
          echo "🚀 Starting deployment to production environment..."
          
          export KUBECONFIG=kubeconfig
          
          # Apply namespace
          echo "📦 Applying namespace..."
          kubectl apply -f k8s/namespace.yaml
          
          # Apply configmap
          echo "📦 Applying configmap..."
          kubectl apply -f k8s/configmap.yaml -n customer-success-fte
          
          # Apply secrets
          echo "📦 Applying secrets..."
          kubectl apply -f k8s/secrets.yaml -n customer-success-fte
          
          # Update API image
          echo "📦 Updating fte-api image..."
          kubectl set image deployment/fte-api fte-api=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
          
          # Update worker image (if deployment exists)
          if kubectl get deployment fte-worker -n customer-success-fte &> /dev/null; then
            echo "📦 Updating fte-worker image..."
            kubectl set image deployment/fte-worker fte-worker=${{ vars.REGISTRY }}/customer-success-fte:${{ github.sha }} -n customer-success-fte
          fi
          
          echo "✅ Deployment manifests applied"

      - name: Wait for rollout
        run: |
          echo "⏳ Waiting for production deployment rollout..."
          
          export KUBECONFIG=kubeconfig
          
          # Wait for API deployment
          echo "Waiting for fte-api deployment..."
          kubectl rollout status deployment/fte-api -n customer-success-fte --timeout=300s
          
          # Wait for worker deployment (if exists)
          if kubectl get deployment fte-worker -n customer-success-fte &> /dev/null; then
            echo "Waiting for fte-worker deployment..."
            kubectl rollout status deployment/fte-worker -n customer-success-fte --timeout=300s
          fi
          
          echo "✅ Rollout completed successfully"

      - name: Run health check
        if: vars.DOMAIN != ''
        run: |
          echo "🧪 Running production health check..."
          
          if curl -f --max-time 30 https://support-api.${{ vars.DOMAIN }}/health; then
            echo "✅ Production health check passed"
          else
            echo "::error::Production health check failed"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "## ✅ Production Deployment Successful"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Environment: production"
          echo "Timestamp: $(date -u)"
          echo ""
          echo "🎉 All checks passed!"
