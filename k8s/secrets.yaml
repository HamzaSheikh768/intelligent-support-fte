apiVersion: v1
kind: Secret
metadata:
  name: fte-secrets
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
type: Opaque
stringData:
  # Required: OpenRouter API key
  OPENROUTER_API_KEY: "placeholder-openrouter-key"
  
  # Required: Database password
  POSTGRES_PASSWORD: "placeholder-db-password"
  
  # Optional: Gmail credentials (base64 encoded JSON)
  # To generate: cat gmail-credentials.json | base64 -w 0
  GMAIL_CREDENTIALS: "placeholder-gmail-credentials"
  
  # Optional: Twilio credentials for WhatsApp
  TWILIO_ACCOUNT_SID: "placeholder-twilio-sid"
  TWILIO_AUTH_TOKEN: "placeholder-twilio-token"
  TWILIO_WHATSAPP_NUMBER: "whatsapp:+14155238886"
  
  # Application secret key
  SECRET_KEY: "placeholder-secret-key-change-in-production"
