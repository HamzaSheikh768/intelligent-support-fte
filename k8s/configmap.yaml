apiVersion: v1
kind: ConfigMap
metadata:
  name: fte-config
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  POSTGRES_HOST: "postgres.customer-success-fte.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fte_db"
  POSTGRES_USER: "fte_user"
  OPENROUTER_MODEL: "gpt-4o"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  # Channel configs
  GMAIL_ENABLED: "true"
  WHATSAPP_ENABLED: "true"
  WEBFORM_ENABLED: "true"
  # Response limits
  MAX_EMAIL_LENGTH: "2000"
  MAX_WHATSAPP_LENGTH: "1600"
  MAX_WEBFORM_LENGTH: "1000"
  # API settings
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  # CORS (update for your domain)
  CORS_ORIGINS: '["https://staging-support.yourdomain.com","http://localhost:3000"]'
